# Déploiement de référence qui respecte toutes les policies du repo.
# À copier comme point de départ pour un nouveau service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: secure-app
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: secure-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: secure-app
    spec:
      automountServiceAccountToken: false # l'appli n'appelle pas l'API Kubernetes
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.k8s.io/pause:3.10 # tag figé, registre autorisé
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

# Montage du socket containerd de l'hôte
# expect: disallow-host-path
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-05
  namespace: e2e
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: secure-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: secure-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: registry.k8s.io/pause:3.10
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: sock
          mountPath: /run/containerd.sock
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: sock
        hostPath:
          path: /run/containerd/containerd.sock

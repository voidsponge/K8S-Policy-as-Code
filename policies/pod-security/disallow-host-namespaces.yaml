apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-host-namespaces
  annotations:
    policies.kyverno.io/title: Interdire les namespaces de l'hôte
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      hostNetwork, hostPID et hostIPC donnent au Pod une vue sur le réseau,
      les processus ou la mémoire partagée du nœud : écoute du trafic des
      autres Pods, lecture des variables d'environnement d'autres processus…
spec:
  background: true
  rules:
    - name: host-namespaces
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kyverno, local-path-storage]
      validate:
        failureAction: Enforce
        message: >-
          hostNetwork, hostPID et hostIPC doivent être absents ou à false.
        pattern:
          spec:
            =(hostNetwork): "false"
            =(hostPID): "false"
            =(hostIPC): "false"

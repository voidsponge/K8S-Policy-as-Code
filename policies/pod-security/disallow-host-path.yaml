apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-host-path
  annotations:
    policies.kyverno.io/title: Interdire les volumes hostPath
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod, Volume
    policies.kyverno.io/description: >-
      Un volume hostPath monte un répertoire du nœud dans le conteneur. Monter
      /var/run/containerd.sock ou / suffit à prendre le contrôle du nœud.
spec:
  background: true
  rules:
    - name: host-path
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kyverno, local-path-storage]
      validate:
        failureAction: Enforce
        message: Les volumes hostPath sont interdits.
        pattern:
          spec:
            =(volumes):
              - X(hostPath): "null"

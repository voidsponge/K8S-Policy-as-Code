apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-default-deny-networkpolicy
  annotations:
    policies.kyverno.io/title: NetworkPolicy default-deny pour chaque namespace
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Namespace, NetworkPolicy
    policies.kyverno.io/description: >-
      Par défaut, tous les Pods d'un cluster peuvent se parler. Cette policy de
      génération crée une NetworkPolicy default-deny (entrée) dans chaque
      nouveau namespace : une application compromise ne peut plus joindre les
      autres sans règle explicite. synchronize empêche de la supprimer à la main.
spec:
  rules:
    - name: default-deny-ingress
      match:
        any:
          - resources:
              kinds: [Namespace]
      exclude:
        any:
          - resources:
              names: [kube-system, kube-public, kube-node-lease, default, kyverno, local-path-storage]
      generate:
        generateExisting: false
        synchronize: true
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: default-deny-ingress
        namespace: "{{request.object.metadata.name}}"
        data:
          spec:
            podSelector: {}
            policyTypes:
              - Ingress

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
  annotations:
    policies.kyverno.io/title: Exiger les labels standards
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Les labels app.kubernetes.io/name et app.kubernetes.io/part-of
      permettent de savoir à qui appartient un workload pendant un incident
      et de cibler les NetworkPolicies.
spec:
  background: true
  rules:
    - name: standard-labels
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kyverno, local-path-storage]
      validate:
        failureAction: Enforce
        message: >-
          Les labels app.kubernetes.io/name et app.kubernetes.io/part-of sont obligatoires.
        pattern:
          metadata:
            labels:
              app.kubernetes.io/name: "?*"
              app.kubernetes.io/part-of: "?*"

name: E2E (kind)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # chaque lundi : vérifie que tout tourne encore
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KYVERNO_CHART_VERSION: 3.8.1 # Kyverno v1.18.1

jobs:
  e2e:
    name: Admission sur un vrai cluster
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cluster kind
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          cluster_name: policy-e2e
      - name: Installer Kyverno
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm install kyverno kyverno/kyverno \
            --version "${KYVERNO_CHART_VERSION}" \
            --namespace kyverno --create-namespace \
            --wait --timeout 5m
      - name: Tests e2e
        run: ./e2e/run.sh
      - name: État des policies
        if: always()
        run: kubectl get clusterpolicies
      - name: Logs Kyverno en cas d'échec
        if: failure()
        run: kubectl logs -n kyverno -l app.kubernetes.io/component=admission-controller --tail=200

apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-privilege-escalation
policies:
- ../../policies/pod-security/disallow-privilege-escalation.yaml
resources:
- resources.yaml
results:
- policy: disallow-privilege-escalation
  rule: privilege-escalation-false
  kind: Pod
  resources:
  - demo/good
  result: pass
- policy: disallow-privilege-escalation
  rule: privilege-escalation-false
  kind: Pod
  resources:
  - demo/escalation-true
  - demo/escalation-unset
  result: fail
- policy: disallow-privilege-escalation
  rule: privilege-escalation-false
  kind: Pod
  resources:
  - kube-system/system-pod
  result: skip

apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-privileged-containers
policies:
- ../../policies/pod-security/disallow-privileged-containers.yaml
resources:
- resources.yaml
results:
- policy: disallow-privileged-containers
  rule: privileged-false
  kind: Pod
  resources:
  - demo/good
  - demo/no-security-context
  result: pass
- policy: disallow-privileged-containers
  rule: privileged-false
  kind: Pod
  resources:
  - demo/privileged
  - demo/privileged-init
  result: fail
- policy: disallow-privileged-containers
  rule: privileged-false
  kind: Pod
  resources:
  - kube-system/system-pod
  result: skip
